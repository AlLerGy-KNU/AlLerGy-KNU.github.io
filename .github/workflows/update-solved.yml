name: Update solved.ac data

on:
#  schedule:
#    - cron: "0 21 * * *"   # 매일 06:00 KST (cron은 UTC 기준) — 자동 갱신 켤 때 주석 해제
  workflow_dispatch:        # Actions 탭에서 수동 실행 (버튼 누를 때만 동작)

permissions:
  contents: write

concurrency:
  group: update-solved
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch solved.ac data
        run: python getUserInfoList.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userInfoList.json news.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "chore: update solved.ac data ($(date -u +%Y-%m-%d))"
            git push
          fi
