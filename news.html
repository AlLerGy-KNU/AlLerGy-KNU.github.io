<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./img/logo/logo1x.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlLerGy News</title>
  <link rel="stylesheet" href="newsStyle.css">
</head>
<body>

  <!-- Global nav -->
  <nav class="news-nav">
    <a class="news-nav-brand" href="https://allergy-knu.github.io/">AlLerGy</a>
    <div class="news-nav-divider"></div>
    <span class="news-nav-title">News</span>
  </nav>

  <div class="news-container">

    <header class="news-header">
      <p class="news-eyebrow">AlLerGy</p>
      <h1 class="news-title">News</h1>
      <p id="last-update" class="news-last-update"></p>
    </header>

    <div id="log-container" class="log-container"></div>

    <nav class="news-pagination">
      <button id="prev-btn" class="pagination-btn">← Prev</button>
      <span id="page-info" class="pagination-info"></span>
      <button id="next-btn" class="pagination-btn">Next →</button>
    </nav>

  </div>

  <script src="newsScript.js"></script>
</body>
</html>
